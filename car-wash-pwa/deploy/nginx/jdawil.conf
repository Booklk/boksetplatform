# Jdawil Nginx vhost.
#
# SSL termination is handled by Cloudflare in production (Full Strict).
# This config listens on plain HTTP inside the container — the Cloudflare
# origin certificate or the host's reverse proxy is responsible for TLS.
#
# Three locations:
#   /api/*    →  Node API (port 3001 in compose network)
#   /ws/*     →  WebSocket upgrade
#   /uploads/ →  static uploads (when STORAGE_PROVIDER=local; ignored when s3)
#   /         →  Vite SPA — fall-through to index.html for client-side routes

upstream jdawil_api {
  server api:3001;
  keepalive 64;
}

# Health probe used by docker-compose + Cloudflare.
server {
  listen 8080;
  location /healthz { return 200; access_log off; }
}

server {
  listen 80 default_server;
  server_name _;

  # Real client IP behind Cloudflare. Cloudflare-known ranges only — anyone
  # else sending CF-Connecting-IP gets ignored.
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  real_ip_header CF-Connecting-IP;

  # Body size limit — KYC PDFs can be 10MB, image uploads are smaller.
  client_max_body_size 12m;

  # Gzip on for text payloads.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain text/css text/xml
    application/json application/javascript application/xml+rss
    application/atom+xml image/svg+xml;

  # Security headers — Cloudflare may also set some of these; we set them
  # at origin too so direct-to-origin traffic gets them.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # ── API ────────────────────────────────────────────────────────────────
  location /api/ {
    proxy_pass http://jdawil_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # ── WebSocket (live tracking + realtime updates) ───────────────────────
  location /ws {
    proxy_pass http://jdawil_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 7d;  # long-lived
    proxy_send_timeout 7d;
  }
  location /realtime {
    proxy_pass http://jdawil_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 7d;
    proxy_send_timeout 7d;
  }

  # ── Uploads (local mode) ───────────────────────────────────────────────
  # When STORAGE_PROVIDER=s3, these never hit (the app returns S3 URLs).
  # When local, the api container mounts /uploads — proxy through so we
  # don't need to mount the same volume twice.
  location /uploads/ {
    proxy_pass http://jdawil_api;
    proxy_set_header Host $host;
    # Long cache on hashed file names; the app's UUID filenames don't change.
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # ── Static SPA assets — cache aggressively ─────────────────────────────
  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
  }

  # ── PWA service worker — never cache (must pick up new builds) ─────────
  location = /sw.js {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
  }
  location = /manifest.webmanifest {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=3600";
  }

  # ── Sitemap + robots — proxied to the API (it's dynamic) ──────────────
  location = /sitemap.xml { proxy_pass http://jdawil_api; }
  location = /robots.txt  { proxy_pass http://jdawil_api; }

  # ── SPA fallback ───────────────────────────────────────────────────────
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    # HTML itself shouldn't be long-cached (so deploys land).
    add_header Cache-Control "public, max-age=60, must-revalidate";
  }
}
