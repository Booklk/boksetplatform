# Jdawil production stack.
#
# Four services on one VPS:
#   db     — Postgres 16 with daily backups to ./backups
#   redis  — cache + WhatsApp queue persistence
#   api    — Node server (multi-stage Dockerfile.server)
#   web    — Nginx serving the built SPA + reverse-proxying /api and /ws
#
# Networking: web is the only public-facing service (port 80). It proxies
# to api over an internal compose network. db and redis are not exposed
# to the host — only the api can reach them.
#
# Storage: Postgres data + backups + (local-mode) uploads use named
# volumes pinned to ./data/* on the host so a daily `tar` of ./data
# captures everything that matters.
#
# Cloudflare in front of port 80 handles TLS + global CDN.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-jdawil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must set in .env}
      POSTGRES_DB:       ${POSTGRES_DB:-jdawil}
      # Tuned for the 4-8 vCPU / 8-16GB tier most VPS deployments use.
      # Override these in .env for larger machines.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jdawil} -d ${POSTGRES_DB:-jdawil}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-jdawil}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jdawil}
      REDIS_URL: redis://redis:6379
      WHATSAPP_QUEUE_PERSIST: "1"
      # Pass through everything else from .env — see deploy/.env.example
      # for the full list. Required: JWT_SECRET, ENCRYPTION_KEY,
      # HEALTH_CHECK_TOKEN.
      JWT_SECRET:                ${JWT_SECRET:?must set in .env}
      ENCRYPTION_KEY:            ${ENCRYPTION_KEY:?must set in .env}
      HEALTH_CHECK_TOKEN:        ${HEALTH_CHECK_TOKEN:?must set in .env}
      BASE_URL:                  ${BASE_URL}
      DOMAIN:                    ${DOMAIN}
      PLATFORM_DOMAINS:          ${PLATFORM_DOMAINS}
      WHATSAPP_TOKEN:            ${WHATSAPP_TOKEN}
      WHATSAPP_PHONE_ID:         ${WHATSAPP_PHONE_ID}
      MOYASAR_API_KEY:           ${MOYASAR_API_KEY}
      MOYASAR_WEBHOOK_SECRET:    ${MOYASAR_WEBHOOK_SECRET}
      SENTRY_DSN:                ${SENTRY_DSN}
      SENTRY_RELEASE:            ${SENTRY_RELEASE}
      GIT_COMMIT:                ${GIT_COMMIT}
      VAPID_PUBLIC_KEY:          ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY:         ${VAPID_PRIVATE_KEY}
      VAPID_EMAIL:               ${VAPID_EMAIL}
      OPENAI_API_KEY:            ${OPENAI_API_KEY}
      OPENAI_MODEL:              ${OPENAI_MODEL:-gpt-4o-mini}
      STORAGE_PROVIDER:          ${STORAGE_PROVIDER:-local}
      S3_ENDPOINT:               ${S3_ENDPOINT}
      S3_REGION:                 ${S3_REGION}
      S3_BUCKET:                 ${S3_BUCKET}
      S3_ACCESS_KEY:             ${S3_ACCESS_KEY}
      S3_SECRET_KEY:             ${S3_SECRET_KEY}
      S3_PUBLIC_URL:             ${S3_PUBLIC_URL}
      S3_BACKUP_BUCKET:          ${S3_BACKUP_BUCKET}
      DB_POOL_MAX:               ${DB_POOL_MAX:-100}
      WHATSAPP_QUEUE_CONCURRENT: ${WHATSAPP_QUEUE_CONCURRENT:-8}
      SLOW_REQUEST_MS:           ${SLOW_REQUEST_MS:-1000}
      MAINTENANCE_MODE:          ${MAINTENANCE_MODE:-}
    volumes:
      # Local-mode uploads persist on the host so a container rebuild
      # doesn't wipe vendor logos. Ignored when STORAGE_PROVIDER=s3.
      - ./data/uploads:/app/uploads
      # Backups land here when you run scripts/backup.sh.
      - ./data/backups:/app/backups
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: ../
      dockerfile: deploy/Dockerfile.client
      args:
        VITE_API_URL:                ${VITE_API_URL}
        VITE_FIREBASE_API_KEY:       ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN:   ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID:    ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_APP_ID:        ${VITE_FIREBASE_APP_ID}
        VITE_VAPID_PUBLIC_KEY:       ${VITE_VAPID_PUBLIC_KEY}
        VITE_SENTRY_DSN:             ${VITE_SENTRY_DSN}
        VITE_MOYASAR_PUBLISHABLE_KEY: ${VITE_MOYASAR_PUBLISHABLE_KEY}
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"  # health probe (internal, expose only on private nets)
    depends_on:
      api: { condition: service_started }
