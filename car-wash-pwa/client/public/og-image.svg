<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#12121e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle glow -->
  <circle cx="300" cy="200" r="300" fill="#6366f1" opacity="0.06"/>
  <circle cx="900" cy="500" r="250" fill="#6366f1" opacity="0.04"/>

  <!-- Logo mark -->
  <rect x="80" y="180" width="60" height="60" rx="16" fill="url(#accent)"/>
  <text x="110" y="222" text-anchor="middle" dominant-baseline="central" fill="white" font-size="30" font-weight="900" font-family="Arial, sans-serif">J</text>

  <!-- Title -->
  <text x="160" y="200" fill="white" font-size="42" font-weight="900" font-family="Arial, sans-serif">Jdawil</text>
  <text x="160" y="235" fill="#6366f1" font-size="18" font-weight="600" font-family="Arial, sans-serif">jdawil.sa</text>

  <!-- Main headline -->
  <text x="80" y="340" fill="white" font-size="48" font-weight="900" font-family="Arial, sans-serif" direction="rtl" text-anchor="start">أنشئ موقع حجوزاتك</text>
  <text x="80" y="400" fill="#a5b4fc" font-size="48" font-weight="900" font-family="Arial, sans-serif" direction="rtl" text-anchor="start">بجميع المميزات اللي يحتاجها مشروعك</text>

  <!-- Features strip -->
  <text x="80" y="470" fill="#64748b" font-size="20" font-weight="600" font-family="Arial, sans-serif">حجوزات أونلاين · GPS · مدفوعات · فواتير · تقارير · واتساب</text>

  <!-- CTA -->
  <rect x="80" y="510" width="240" height="50" rx="12" fill="url(#accent)"/>
  <text x="200" y="540" text-anchor="middle" fill="white" font-size="18" font-weight="700" font-family="Arial, sans-serif">جرّب مجاناً 14 يوم</text>

  <!-- Price badge -->
  <text x="360" y="543" fill="#64748b" font-size="16" font-family="Arial, sans-serif">يبدأ من 29 ر.س/شهر</text>

  <!-- Bottom border -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accent)" opacity="0.5"/>
</svg>
